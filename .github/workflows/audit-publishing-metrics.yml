name: Publishing and analytics regression tests

on:
  pull_request:
    paths:
      - "api/**"
      - "build/**"
      - "js/**"
      - "tests/**"
      - "dev-server.js"
      - "robots.txt"
      - "inventory.html"
      - "fr/inventaire.html"
      - "vercel.json"
      - ".github/workflows/audit-publishing-metrics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: find api build js tests -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Run regression tests
        run: node --test tests/*.test.js
