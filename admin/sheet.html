<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Window sheet | Automobile SX</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
/* ---------- the sheet ----------
   Sized for one vehicle per page on Letter or A4, which are close enough that
   a layout built with margins rather than absolute positions prints correctly
   on both. Everything here is print-first; the screen is the preview. */

:root {
  --ink: #0D0D0D; --red: #BA1D26; --bone: #F2EFED;
  --mist: #E4E1DE; --slate: #6B6F76;
  --font: "Inter Tight", -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: #7c7c7c; font-family: var(--font); color: var(--ink);
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}

.bar {
  position: sticky; top: 0; z-index: 10; background: var(--ink); color: var(--bone);
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  padding: 12px 18px; font-size: 14.5px;
}
.bar strong { margin-right: auto; }
.bar button, .bar a {
  font: inherit; font-weight: 700; font-size: 14px; cursor: pointer;
  border-radius: 8px; padding: 8px 14px; border: 1px solid #3a3d40;
  background: none; color: var(--bone); text-decoration: none;
}
.bar button:hover, .bar a:hover { border-color: var(--bone); }
.bar .primary { background: var(--red); border-color: var(--red); color: #fff; }
.bar .on { background: var(--bone); color: var(--ink); }

.sheet {
  width: 210mm; min-height: 290mm; margin: 18px auto; background: #fff;
  padding: 12mm 12mm 10mm; display: flex; flex-direction: column;
  box-shadow: 0 6px 30px rgba(0,0,0,0.35);
}

.head { display: flex; align-items: center; gap: 12px; border-bottom: 3px solid var(--ink); padding-bottom: 8px; }
.head img { width: 46px; height: 46px; }
.brand { font-weight: 800; font-size: 21px; letter-spacing: -0.01em; line-height: 1.1; }
.brand span { color: var(--red); }
.brand small { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--slate); }
.head-contact { margin-left: auto; text-align: right; font-size: 12.5px; line-height: 1.45; color: #33363a; }
.head-contact b { font-size: 15px; color: var(--ink); }

.title { margin: 14px 0 0; font-size: 34px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
.subtitle { margin: 4px 0 0; font-size: 15px; color: var(--slate); font-weight: 600; }

.priceRow { display: flex; align-items: flex-end; gap: 16px; margin: 12px 0 14px; }
.price { font-size: 52px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; color: var(--red); }
.priceNote { font-size: 12px; color: var(--slate); padding-bottom: 6px; }

.photo { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 4px; background: var(--mist); }
.noPhoto { display: flex; align-items: center; justify-content: center; color: var(--slate); font-size: 13px; }

.specs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--mist); margin: 14px 0 0; border: 1px solid var(--mist); }
.spec { background: #fff; padding: 8px 10px; }
.spec dt { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--slate); margin: 0; }
.spec dd { margin: 2px 0 0; font-size: 15px; font-weight: 700; }

.featuresBlock { margin-top: 14px; }
.blockTitle { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--slate); margin: 0 0 6px; }
.features { columns: 3; column-gap: 14px; margin: 0; padding: 0; list-style: none; font-size: 13px; }
.features li { break-inside: avoid; padding: 2px 0 2px 13px; position: relative; }
.features li::before { content: ""; position: absolute; left: 0; top: 9px; width: 5px; height: 5px; background: var(--red); border-radius: 50%; }

.foot { margin-top: auto; padding-top: 12px; border-top: 3px solid var(--ink); display: flex; gap: 16px; align-items: center; }
.qr { width: 34mm; height: 34mm; flex: 0 0 auto; }
.qr svg { width: 100%; height: 100%; display: block; }
.footText { font-size: 13px; line-height: 1.5; }
.footText .big { font-size: 19px; font-weight: 800; letter-spacing: -0.01em; }
.footText .url { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #33363a; }
.stock { margin-left: auto; text-align: right; font-size: 12px; color: var(--slate); }
.stock b { display: block; font-size: 22px; font-weight: 800; color: var(--ink); letter-spacing: -0.01em; }

.missing { padding: 40px; text-align: center; color: var(--slate); }

@media print {
  body { background: #fff; }
  .bar { display: none; }
  .sheet { width: auto; min-height: 0; height: 100vh; margin: 0; padding: 0; box-shadow: none; page-break-after: always; }
  .sheet:last-child { page-break-after: auto; }
}
@page { size: portrait; margin: 12mm; }
</style>
</head>
<body>

<div class="bar">
  <strong>Window sheet</strong>
  <button type="button" id="lang-en" class="on">English</button>
  <button type="button" id="lang-fr">Français</button>
  <button type="button" class="primary" id="print">Print / Save as PDF</button>
  <a href="/admin/">← Back to inventory</a>
</div>

<div id="sheets"></div>

<script src="/js/features.js"></script>
<script src="/js/describe.js"></script>
<script src="/js/qr.js"></script>
<script src="/admin/sheet.js"></script>
</body>
</html>
