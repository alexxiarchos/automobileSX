<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Window sheet | Automobile SX</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
/* ---------- the sheet ----------
   Laid out after the standard Quebec dealer sticker: a card grid, the price and
   the model stacked large in the top right where a person looks first, the
   equipment list down the left, and the identifying numbers and specifications
   down the right. What that reference carries and this does not is the legal
   half - warranty class, prior use, repairs, the signature block. That belongs
   on the label the law prescribes, not on an advertisement, and mixing them
   would produce a document that does neither job properly.

   What this adds that the reference does not have: a photo, and a QR code that
   opens the vehicle's own page with every photo on it.

   Print-first. One vehicle per page on Letter and A4 alike; the screen is
   simply the preview. */

:root {
  --ink: #0D0D0D; --red: #BA1D26; --bone: #F2EFED;
  --mist: #E4E1DE; --slate: #6B6F76; --line: #DCD8D4;
  --font: "Inter Tight", -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: #7c7c7c; font-family: var(--font); color: var(--ink);
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}

.bar {
  position: sticky; top: 0; z-index: 10; background: var(--ink); color: var(--bone);
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  padding: 12px 18px; font-size: 14.5px;
}
.bar strong { margin-right: auto; }
.bar button, .bar a {
  font: inherit; font-weight: 700; font-size: 14px; cursor: pointer;
  border-radius: 8px; padding: 8px 14px; border: 1px solid #3a3d40;
  background: none; color: var(--bone); text-decoration: none;
}
.bar button:hover, .bar a:hover { border-color: var(--bone); }
.bar .primary { background: var(--red); border-color: var(--red); color: #fff; }
.bar .on { background: var(--bone); color: var(--ink); }

.sheet {
  width: 210mm; min-height: 292mm; margin: 18px auto; background: #fff;
  padding: 10mm; display: flex; flex-direction: column; gap: 5mm;
  box-shadow: 0 6px 30px rgba(0,0,0,0.35);
}

/* cards */
.card { border: 1px solid var(--line); border-radius: 10px; padding: 6mm; background: #fff; }
.card.tinted { background: var(--bone); border-color: var(--bone); }
.cardTitle {
  margin: 0 0 4mm; font-size: 17px; font-weight: 800; letter-spacing: -0.01em;
}

/* header: identity on the left, the numbers on the right */
.top { display: grid; grid-template-columns: 1fr 1fr; gap: 5mm; align-items: stretch; }

.brand { display: flex; flex-direction: column; justify-content: center; gap: 3mm; }
.brandRow { display: flex; align-items: center; gap: 10px; }
.brandRow img { width: 54px; height: 54px; }
.brandName { font-weight: 800; font-size: 27px; letter-spacing: -0.02em; line-height: 1; }
.brandName span { color: var(--red); }
.brandLines { font-size: 13px; line-height: 1.6; color: #33363a; }
.brandLines b { color: var(--ink); font-size: 15px; }
.brandLines .row { display: flex; gap: 7px; align-items: baseline; }
.brandLines svg { width: 12px; height: 12px; flex: 0 0 12px; fill: var(--slate); }

/* price and model, stacked and centred, biggest thing on the page */
.headline { text-align: center; display: flex; flex-direction: column; justify-content: center; gap: 1mm; }
.price { font-size: 46px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; color: var(--red); }
/* Sits under the price and stays under it: an invitation to ask, deliberately
   quieter than the number above it and carrying no rate, term or condition. */
.finance { font-size: 12.5px; font-weight: 600; color: var(--slate); margin-top: 1.5mm; line-height: 1.3; }
.make { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; margin-top: 3mm; line-height: 1.1; }
.model { font-size: 38px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
.trim { font-size: 17px; font-weight: 600; color: #33363a; }
.year { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; margin-top: 2mm; }

/* body: equipment left, numbers and specs right */
.body { display: grid; grid-template-columns: 1fr 1fr; gap: 5mm; align-items: start; }

.photo { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 8px; background: var(--mist); display: block; }

.features { columns: 2; column-gap: 6mm; margin: 0; padding: 0; list-style: none; font-size: 13px; }
.features li { break-inside: avoid; padding: 2.2px 0 2.2px 12px; position: relative; line-height: 1.35; }
.features li::before { content: ""; position: absolute; left: 0; top: 8px; width: 4px; height: 4px; background: var(--red); border-radius: 50%; }

/* the identifying numbers, the way the trade writes them */
.ids { display: grid; grid-template-columns: 1fr 1fr; gap: 4mm 5mm; margin-bottom: 5mm; }
.id { display: flex; gap: 8px; align-items: flex-start; }
.id svg { width: 17px; height: 17px; flex: 0 0 17px; margin-top: 2px; fill: none; stroke: var(--ink); stroke-width: 1.7; }
.id dt { margin: 0; font-size: 14px; font-weight: 800; letter-spacing: -0.01em; }
.id dd { margin: 1px 0 0; font-size: 15px; }
.id dd.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13.5px; letter-spacing: 0.03em; }

.specs { display: grid; grid-template-columns: 1fr 1fr; gap: 3.5mm 5mm; border-top: 1px solid var(--line); padding-top: 4mm; }
.spec dt { margin: 0; font-size: 13px; font-weight: 800; }
.spec dd { margin: 1px 0 0; font-size: 14px; color: #33363a; line-height: 1.35; }

/* footer: the thing their sticker has no answer for */
.foot {
  margin-top: auto; display: flex; gap: 6mm; align-items: center;
  border: 1px solid var(--line); border-radius: 10px; padding: 4mm 6mm;
}
.qr { width: 32mm; height: 32mm; flex: 0 0 auto; }
.qr svg { width: 100%; height: 100%; display: block; }
.footText { font-size: 13.5px; line-height: 1.5; }
.footText .big { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
.footText .url { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #33363a; }
.stock { margin-left: auto; text-align: right; font-size: 12px; color: var(--slate); }
.stock b { display: block; font-size: 24px; font-weight: 800; color: var(--ink); letter-spacing: -0.01em; }

.missing { padding: 40px; text-align: center; color: var(--slate); }

@media print {
  body { background: #fff; }
  .bar { display: none; }
  .sheet { width: auto; min-height: 0; height: 100vh; margin: 0; padding: 0; box-shadow: none; page-break-after: always; }
  .sheet:last-child { page-break-after: auto; }
}
@page { size: portrait; margin: 11mm; }
</style>
</head>
<body>

<div class="bar">
  <strong>Window sheet</strong>
  <button type="button" id="lang-en" class="on">English</button>
  <button type="button" id="lang-fr">Français</button>
  <button type="button" class="primary" id="print">Print / Save as PDF</button>
  <a href="/admin/">← Back to inventory</a>
</div>

<div id="sheets"></div>

<script src="/js/features.js"></script>
<script src="/js/describe.js"></script>
<script src="/js/qr.js"></script>
<script src="/admin/sheet.js"></script>
</body>
</html>
